<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StayManager Pro</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9A84C;--gold-lt:#EDD98A;--gold-dk:#9A7B2E;--gold-bg:rgba(201,168,76,.10);
  --navy:#0B1829;--navy2:#132238;--navy3:#1C3050;
  --bg:#F4F1EB;--bg2:#EAE6DC;--surf:#FFFFFF;--surf2:#FAFAF6;--surf3:#F5F2EA;
  --txt:#111827;--txt2:#4B5563;--txt3:#9CA3AF;
  --brd:#E3DCCF;--brd2:#D1C9B8;
  --ok:#15803D;--ok-bg:#DCFCE7;--ok-brd:#BBF7D0;
  --wn:#B45309;--wn-bg:#FEF3C7;--wn-brd:#FDE68A;
  --er:#B91C1C;--er-bg:#FEE2E2;--er-brd:#FECACA;
  --in:#1D4ED8;--in-bg:#DBEAFE;--in-brd:#BFDBFE;
  --pu:#7C3AED;--pu-bg:#EDE9FE;
  --r:10px;--rsm:7px;--rlg:16px;--rxl:22px;
  --sh:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05);
  --shm:0 4px 24px rgba(0,0,0,.09);
  --shl:0 8px 48px rgba(0,0,0,.14);
  --fw:'DM Sans',system-ui,sans-serif;
  --fd:'Playfair Display',Georgia,serif;
  --sw:256px;--hh:60px;
}
[data-theme=dark]{
  --bg:#07101C;--bg2:#0C1A29;--surf:#0F1F33;--surf2:#142638;--surf3:#192F45;
  --txt:#E8E2D4;--txt2:#7A9BB5;--txt3:#3D5A70;
  --brd:#1A3048;--brd2:#22405E;
  --ok:#4ADE80;--ok-bg:rgba(74,222,128,.10);--ok-brd:rgba(74,222,128,.25);
  --wn:#FCD34D;--wn-bg:rgba(252,211,77,.10);--wn-brd:rgba(252,211,77,.25);
  --er:#F87171;--er-bg:rgba(248,113,113,.10);--er-brd:rgba(248,113,113,.25);
  --in:#60A5FA;--in-bg:rgba(96,165,250,.10);--in-brd:rgba(96,165,250,.25);
  --pu:#A78BFA;--pu-bg:rgba(167,139,250,.10);
}
body{font-family:var(--fw);background:var(--bg);color:var(--txt);min-height:100vh;transition:background .25s,color .25s;-webkit-font-smoothing:antialiased}
#root{display:flex;min-height:100vh}
button,input,select,textarea{font-family:var(--fw)}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

/* ─── SIDEBAR ─── */
.sb{width:var(--sw);background:var(--navy);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:200;overflow-y:auto;overflow-x:hidden;transition:transform .25s}
.sb-logo{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0}
.sb-logo-mark{display:flex;align-items:center;gap:11px;margin-bottom:3px}
.sb-logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--gold) 0%,var(--gold-dk) 100%);border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 3px 10px rgba(201,168,76,.35)}
.sb-logo h1{font-family:var(--fd);font-size:18px;font-weight:700;color:#fff;letter-spacing:.3px;line-height:1.1}
.sb-logo span{font-size:8.5px;color:rgba(255,255,255,.20);letter-spacing:3px;text-transform:uppercase;margin-top:3px;display:block;padding-left:47px}
.sb-sec{padding:18px 18px 5px;font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,.18);font-weight:600;flex-shrink:0}
.sb-nav{flex:1;padding:4px 8px;overflow-y:auto}
.ni{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--rsm);transition:all .15s;color:rgba(255,255,255,.45);font-size:13.5px;font-weight:400;margin-bottom:1px;border:none;background:transparent;width:100%;text-align:left;position:relative}
.ni:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.82)}
.ni.on{background:rgba(201,168,76,.16);color:var(--gold);font-weight:500}
.ni-icon{width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.ni-bdg{margin-left:auto;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600;line-height:1.4}
.sb-footer{padding:12px 8px;border-top:1px solid rgba(255,255,255,.06);flex-shrink:0}
.sb-user{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--rsm);background:rgba(255,255,255,.05);margin-bottom:7px}
.sb-ava{width:32px;height:32px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--navy);flex-shrink:0}
.sb-uinfo p{font-size:13px;color:rgba(255,255,255,.88);font-weight:500;line-height:1.2}
.sb-uinfo span{font-size:10.5px;color:rgba(255,255,255,.28);text-transform:capitalize}

/* ─── MAIN ─── */
.main{margin-left:var(--sw);flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{background:var(--surf);border-bottom:1px solid var(--brd);padding:0 28px;height:var(--hh);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;transition:background .25s,border-color .25s}
.tb-title{font-family:var(--fd);font-size:20px;font-weight:600;color:var(--txt);letter-spacing:.2px}
.tb-right{display:flex;align-items:center;gap:8px}
.pg{padding:24px 28px;flex:1}

/* ─── BUTTONS ─── */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:var(--rsm);border:none;font-size:13.5px;font-weight:500;transition:all .14s;line-height:1;white-space:nowrap}
.bp{background:var(--gold);color:var(--navy)}.bp:hover{background:var(--gold-dk);transform:translateY(-1px)}
.bg_{background:var(--surf2);color:var(--txt2);border:1px solid var(--brd)}.bg_:hover{background:var(--bg2);color:var(--txt)}
.bd{background:var(--er-bg);color:var(--er);border:1px solid var(--er-brd)}.bd:hover{filter:brightness(.95)}
.bs_{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-brd)}.bs_:hover{filter:brightness(.95)}
.btn-sm{padding:5px 11px;font-size:12.5px}
.ib{padding:6px;border-radius:var(--rsm);background:transparent;border:1px solid var(--brd);display:inline-flex;align-items:center;justify-content:center;color:var(--txt2);transition:all .14s;cursor:pointer}
.ib:hover{background:var(--bg2);border-color:var(--brd2);color:var(--txt)}
.ib svg{width:14px;height:14px;stroke:currentColor;fill:none}
[data-theme=dark] .bg_{background:var(--surf2);border-color:var(--brd2);color:var(--txt2)}
[data-theme=dark] .bg_:hover{background:var(--surf3);color:var(--txt)}

/* ─── CARDS ─── */
.card{background:var(--surf);border-radius:var(--r);border:1px solid var(--brd);padding:20px;box-shadow:var(--sh)}
.card-title{font-family:var(--fd);font-size:16px;font-weight:600;color:var(--txt);margin-bottom:14px;letter-spacing:.1px}

/* ─── STAT CARDS ─── */
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px;margin-bottom:22px}
.sc{background:var(--surf);border-radius:var(--r);border:1px solid var(--brd);padding:18px 20px;box-shadow:var(--sh)}
.sl{font-size:10.5px;color:var(--txt3);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:8px}
.sv{font-family:var(--fd);font-size:28px;font-weight:700;color:var(--txt);line-height:1}
.ss{font-size:11.5px;color:var(--txt3);margin-top:4px}

/* ─── BADGES ─── */
.bdg{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500}
.bgs{background:var(--ok-bg);color:var(--ok)}
.bgw{background:var(--wn-bg);color:var(--wn)}
.bge{background:var(--er-bg);color:var(--er)}
.bgi{background:var(--in-bg);color:var(--in)}
.bgn{background:var(--bg2);color:var(--txt2)}
.bgg{background:#FEF3C7;color:#92400E}
[data-theme=dark] .bgg{background:rgba(252,211,77,.12);color:#FCD34D}
[data-theme=dark] .bgn{background:var(--surf2);color:var(--txt2)}

/* ─── ALERTS ─── */
.al{padding:11px 14px;border-radius:var(--rsm);font-size:13px;display:flex;gap:9px;margin-bottom:14px;border:1px solid transparent;align-items:flex-start}
.al svg{flex-shrink:0;margin-top:1px;stroke:currentColor;fill:none;width:15px;height:15px}
.al-s{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-brd)}
.al-e{background:var(--er-bg);color:var(--er);border-color:var(--er-brd)}
.al-w{background:var(--wn-bg);color:var(--wn);border-color:var(--wn-brd)}
.al-i{background:var(--in-bg);color:var(--in);border-color:var(--in-brd)}

/* ─── TABLE ─── */
.tw{overflow-x:auto;border-radius:var(--r);border:1px solid var(--brd);background:var(--surf)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;padding:9px 14px;background:var(--surf2);color:var(--txt3);font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:600;border-bottom:1px solid var(--brd)}
td{padding:11px 14px;border-bottom:1px solid var(--brd);color:var(--txt);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg2)}
[data-theme=dark] tr:hover td{background:rgba(255,255,255,.02)}

/* ─── FORMS ─── */
.fg{margin-bottom:13px}
label{display:block;font-size:12px;font-weight:500;color:var(--txt2);margin-bottom:5px;letter-spacing:.1px}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--brd2);border-radius:var(--rsm);font-size:13.5px;color:var(--txt);background:var(--surf);transition:border-color .14s,box-shadow .14s;outline:none;line-height:1.4}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.15)}
input:disabled{background:var(--bg2);color:var(--txt3);cursor:not-allowed}
textarea{resize:vertical;min-height:74px;line-height:1.6}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.ff{grid-column:1/-1}
input[type=file]{display:none}
[data-theme=dark] input,[data-theme=dark] select,[data-theme=dark] textarea{background:var(--surf2);border-color:var(--brd2);color:var(--txt)}
[data-theme=dark] select option{background:var(--surf2)}
[data-theme=dark] input[type=date]::-webkit-calendar-picker-indicator,[data-theme=dark] input[type=time]::-webkit-calendar-picker-indicator{filter:invert(1) opacity(.5)}

/* ─── MODAL ─── */
.ov{position:fixed;inset:0;background:rgba(5,12,22,.72);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(5px)}
.mo{background:var(--surf);border-radius:var(--rlg);width:100%;max-width:760px;max-height:92vh;overflow-y:auto;box-shadow:var(--shl);border:1px solid var(--brd)}
.mo-h{padding:20px 24px 16px;border-bottom:1px solid var(--brd);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--surf);z-index:2;border-radius:var(--rlg) var(--rlg) 0 0}
.mo-t{font-family:var(--fd);font-size:19px;font-weight:600;color:var(--txt)}
.mo-b{padding:20px 24px}
.mo-f{padding:14px 24px 20px;display:flex;gap:9px;justify-content:flex-end;border-top:1px solid var(--brd);background:var(--surf2);border-radius:0 0 var(--rlg) var(--rlg)}

/* ─── TABS ─── */
.tabs{display:flex;gap:2px;background:var(--bg2);padding:3px;border-radius:var(--rsm);width:fit-content;margin-bottom:18px;border:1px solid var(--brd)}
.tab{padding:6px 17px;border-radius:6px;font-size:13px;font-weight:400;color:var(--txt2);transition:all .14s;border:none;background:transparent;cursor:pointer}
.tab.on{background:var(--surf);color:var(--txt);font-weight:500;box-shadow:0 1px 4px rgba(0,0,0,.10)}
[data-theme=dark] .tabs{background:var(--surf2)}
[data-theme=dark] .tab.on{background:var(--surf3)}

/* ─── CALENDAR ─── */
.cal-wrap{background:var(--surf);border-radius:var(--r);border:1px solid var(--brd);overflow:hidden;box-shadow:var(--sh)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--brd)}
.cal-dlbl{background:var(--surf2);text-align:center;padding:7px 0;font-size:10px;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:.8px}
.cal-cell{min-height:90px;background:var(--surf);padding:6px;cursor:pointer;transition:background .12s}
.cal-cell:hover{background:var(--bg2)}
.cal-cell.tdy{background:rgba(201,168,76,.07)}
.cal-cell.om{opacity:.45;background:var(--bg2)}
.cal-dt{width:23px;height:23px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--txt2);margin-bottom:4px;border-radius:50%}
.cal-cell.tdy .cal-dt{background:var(--gold);color:var(--navy);font-weight:700}
.cal-ev{font-size:10px;padding:2px 5px;border-radius:3px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.5;font-weight:500}

/* ─── NAV BAR for schedule ─── */
.sch-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.cal-nav-btn{width:32px;height:32px;border-radius:var(--rsm);border:1px solid var(--brd);background:var(--surf);display:flex;align-items:center;justify-content:center;color:var(--txt2);transition:all .14s;cursor:pointer;flex-shrink:0}
.cal-nav-btn:hover{background:var(--bg2);border-color:var(--brd2);color:var(--txt)}
.cal-nav-btn svg{width:14px;height:14px;stroke:currentColor;fill:none}
.cal-nav-label{font-family:var(--fd);font-size:16px;font-weight:600;color:var(--txt);min-width:220px;text-align:center}

/* ─── WEEK VIEW ─── */
.wk-wrap{background:var(--surf);border-radius:var(--r);border:1px solid var(--brd);overflow:hidden;box-shadow:var(--sh)}
.wk-head{display:grid;grid-template-columns:54px repeat(7,1fr);border-bottom:1px solid var(--brd)}
.wk-hcell{padding:10px 6px;text-align:center;border-right:1px solid var(--brd);font-size:10px;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:.6px;background:var(--surf2)}
.wk-hcell.tdy{color:var(--gold)}
.wk-body{max-height:520px;overflow-y:auto}
.wk-row{display:grid;grid-template-columns:54px repeat(7,1fr);min-height:38px}
.wk-time{padding:7px 6px;font-size:9.5px;color:var(--txt3);text-align:right;border-right:1px solid var(--brd);border-bottom:1px solid var(--brd);background:var(--surf2)}
.wk-cell{border-right:1px solid var(--brd);border-bottom:1px solid var(--brd);padding:2px 3px;min-height:38px}
.wk-cell.tdy{background:rgba(201,168,76,.04)}

/* ─── DAY VIEW ─── */
.dv-wrap{background:var(--surf);border-radius:var(--r);border:1px solid var(--brd);overflow:hidden;box-shadow:var(--sh)}
.dv-head{background:var(--surf2);padding:16px 20px;border-bottom:1px solid var(--brd)}
.dv-events{padding:14px;display:flex;flex-wrap:wrap;gap:10px;border-bottom:1px solid var(--brd)}
.dv-card{border-radius:8px;padding:10px 14px;min-width:180px;border-left:3px solid}
.dv-slots{max-height:400px;overflow-y:auto}
.dv-row{display:flex;border-bottom:1px solid var(--brd);min-height:38px}
.dv-time{width:64px;padding:6px 10px;font-size:10px;color:var(--txt3);flex-shrink:0;border-right:1px solid var(--brd)}
.dv-content{flex:1}

/* ─── UPLOAD ─── */
.up-area{border:2px dashed var(--brd2);border-radius:var(--rsm);padding:20px;text-align:center;cursor:pointer;transition:all .18s;background:var(--surf3)}
.up-area:hover{border-color:var(--gold);background:rgba(201,168,76,.06)}
.up-area img{max-width:100%;max-height:160px;border-radius:var(--rsm);object-fit:cover}

/* ─── GUEST ROW ─── */
.gr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--surf);border:1px solid var(--brd);border-radius:var(--r);margin-bottom:9px;box-shadow:var(--sh);transition:box-shadow .15s}
.gr:hover{box-shadow:var(--shm)}
.gr-ava{width:36px;height:36px;border-radius:50%;background:rgba(201,168,76,.18);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--gold-dk);font-size:12px;flex-shrink:0}

/* ─── LOGIN ─── */
/* ─── LOGIN SPLIT SCREEN ─── */
.lw{min-height:100vh;display:flex;align-items:stretch;background:var(--navy);overflow:hidden}
.lw-photo{flex:1;position:relative;overflow:hidden;min-height:100vh}
.lw-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
.lw-photo::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(7,16,28,.5) 0%,rgba(7,16,28,.2) 60%,rgba(7,16,28,.45) 100%)}
.lw-photo-caption{position:absolute;bottom:36px;left:36px;z-index:2;color:#fff}
.lw-photo-caption h2{font-family:var(--fd);font-size:26px;font-weight:700;line-height:1.2;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.lw-photo-caption p{font-size:13px;color:rgba(255,255,255,.6);margin-top:6px;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.lw-form-side{width:460px;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:48px 44px;background:var(--navy);position:relative;overflow:hidden}
.lw-form-side::before{content:'';position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,.10) 0%,transparent 70%);top:-150px;right:-200px;pointer-events:none}
.lw-form-side::after{content:'';position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,.06) 0%,transparent 70%);bottom:-100px;left:-150px;pointer-events:none}
.lb{width:100%;position:relative;z-index:2}
.ll{text-align:center;margin-bottom:36px}
.ll-icon{width:60px;height:60px;background:linear-gradient(135deg,var(--gold),var(--gold-dk));border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 6px 20px rgba(201,168,76,.4)}
.ll h1{font-family:var(--fd);font-size:30px;color:#fff;font-weight:700;letter-spacing:.5px;line-height:1}
.ll p{color:rgba(255,255,255,.35);font-size:13px;margin-top:7px;letter-spacing:.3px}
.lb label{color:rgba(255,255,255,.5)}
.lb input{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.10);color:#fff}
.lb input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.2)}
.lb input::placeholder{color:rgba(255,255,255,.25)}
@media(max-width:860px){.lw-photo{display:none}.lw-form-side{width:100%;padding:36px 28px}}

/* ─── DIVIDER ─── */
.dv_{height:1px;background:var(--brd);margin:16px 0}

/* ─── SECTION HEADER ─── */
.sh_{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.st_{font-family:var(--fd);font-size:18px;font-weight:600;color:var(--txt);letter-spacing:.1px}

/* ─── DASHBOARD HERO ─── */
.hero{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surf);border-radius:var(--r);border:1px solid var(--brd);overflow:hidden;box-shadow:var(--sh);margin-bottom:22px}
.hc{padding:22px 20px;border-right:1px solid var(--brd);position:relative;overflow:hidden}
.hc:last-child{border-right:none}
.hc-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.hc-icon svg{width:20px;height:20px;stroke:currentColor;fill:none}
.hc-n{font-family:var(--fd);font-size:34px;font-weight:700;line-height:1;margin-bottom:4px;color:var(--txt)}
.hc-l{font-size:11px;color:var(--txt3);text-transform:uppercase;letter-spacing:.9px;font-weight:600}
.hc-sub{font-size:12px;margin-top:6px;font-weight:500}
.hc::after{content:'';position:absolute;bottom:-24px;right:-24px;width:96px;height:96px;border-radius:50%;background:currentColor;opacity:.04}

/* ─── DASHBOARD CREATIVE HERO ─── */
.dash-welcome{background:linear-gradient(135deg,var(--navy) 0%,var(--navy3) 100%);border-radius:var(--r);padding:28px 30px;margin-bottom:22px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:20px}
.dash-welcome::before{content:'';position:absolute;top:-60px;right:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,.18) 0%,transparent 70%);pointer-events:none}
.dash-welcome::after{content:'';position:absolute;bottom:-80px;left:30%;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,.09) 0%,transparent 70%);pointer-events:none}
.dw-text h2{font-family:var(--fd);font-size:24px;font-weight:700;color:#fff;margin-bottom:5px}
.dw-text p{color:rgba(255,255,255,.45);font-size:13.5px;line-height:1.5}
.dw-stats{display:flex;gap:22px;flex-shrink:0;position:relative;z-index:1}
.dw-stat{text-align:center}
.dw-stat-n{font-family:var(--fd);font-size:28px;font-weight:700;color:var(--gold);line-height:1}
.dw-stat-l{font-size:10px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1px;margin-top:2px}

/* ─── TIMELINE ─── */
.tl{background:var(--surf);border-radius:var(--r);border:1px solid var(--brd);overflow:hidden;box-shadow:var(--sh)}
.tl-hdr{padding:14px 18px;border-bottom:1px solid var(--brd);background:var(--surf2);display:flex;align-items:center;justify-content:space-between}
.tl-row{display:grid;border-bottom:1px solid var(--brd)}
.tl-row:last-child{border-bottom:none}
.tl-room{padding:10px 14px;border-right:1px solid var(--brd);font-size:13px;font-weight:500;display:flex;flex-direction:column;justify-content:center;background:var(--surf2)}
.tl-room span{font-size:10.5px;color:var(--txt3);font-weight:400;margin-top:2px}
.tl-day{padding:6px 3px;border-right:1px solid var(--brd);min-height:46px;display:flex;align-items:center;justify-content:center;transition:background .12s;font-size:10px;font-weight:700}

/* ─── OCC RING ─── */
.occ{position:relative;width:86px;height:86px}
.occ-v{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:19px;font-weight:700;color:var(--txt)}

/* ─── PRICING BOX ─── */
.pbox{background:var(--surf2);border:1px solid var(--brd);border-radius:var(--rsm);padding:14px 16px;margin-bottom:14px}
.pbox-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 16px;margin-bottom:12px}
.pbox-label{font-size:10.5px;color:var(--txt3);font-weight:500;text-transform:uppercase;letter-spacing:.6px;margin-bottom:2px}
.pbox-val{font-weight:600;color:var(--txt);font-size:15px}
.disc-toggle{display:flex;border-radius:var(--rsm);border:1px solid var(--brd2);overflow:hidden;flex-shrink:0}
.disc-toggle button{padding:6px 14px;font-size:12px;font-weight:600;border:none;cursor:pointer;transition:all .14s}
.price-total{display:flex;justify-content:space-between;align-items:baseline;padding-top:11px;border-top:1px dashed var(--brd)}

/* ─── SYNC STATUS ─── */
.sync-pill{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--txt3);padding:5px 11px;background:var(--surf2);border-radius:var(--rsm);border:1px solid var(--brd);cursor:default}
.sync-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sync-dot.on{background:#22C55E}
.sync-dot.off{background:#EF4444}
.sync-dot.spin{background:var(--gold);animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ─── ROOM CARD ─── */
.rc{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r);padding:17px;box-shadow:var(--sh)}

/* ─── REPORTS CHART ─── */
.chart-bar{background:var(--brd);border-radius:4px 4px 0 0;transition:all .3s;position:relative;cursor:default}
.chart-bar:hover{filter:brightness(1.1)}

/* ─── MISC ─── */
.empty{text-align:center;padding:44px;color:var(--txt3);font-size:14px}
.tag-pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;background:var(--gold-bg);color:var(--gold-dk);font-weight:500;border:1px solid rgba(201,168,76,.2)}

/* ─── SCROLLBAR ─── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--txt3)}

@media(max-width:768px){
  .sb{transform:translateX(-100%)}.main{margin-left:0}
  .fg2{grid-template-columns:1fr}.hero{grid-template-columns:1fr 1fr}
  .hc:nth-child(2){border-right:none}.pg{padding:14px 16px}
  .dw-stats{display:none}
}
</style>

const useLS = (k, seed) => {
  const [v,sv] = useState(()=>{try{const s=localStorage.getItem(k);return s?JSON.parse(s):seed();}catch{return seed();}});
  const set = useCallback(val=>{sv(val);localStorage.setItem(k,JSON.stringify(val));},[k]);
  return [v,set];
};

/* ══════════ GOOGLE SHEETS API ══════════ */
const SheetsAPI = {
  async call(url, action, payload={}) {
    if (!url) return { success: false, error: 'No URL configured' };
    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action, ...payload }),
      });
      return JSON.parse(await res.text());
    } catch(e) {
      try {
        const params = new URLSearchParams({ action, ...Object.fromEntries(
          Object.entries(payload).map(([k,v])=>[k,typeof v==='object'?JSON.stringify(v):v])
        )});
        const res2 = await fetch(`${url}?${params}`);
        return JSON.parse(await res2.text());
      } catch(e2) { return { success: false, error: e2.message }; }
    }
  },
  ping: (url) => SheetsAPI.call(url,'ping'),
  getReservations: (url) => SheetsAPI.call(url,'getReservations'),
  getRooms: (url) => SheetsAPI.call(url,'getRooms'),
  getUsers: (url) => SheetsAPI.call(url,'getUsers'),
  saveReservation: (url,r) => SheetsAPI.call(url,'addReservation',{reservation:r}),
  updateReservation: (url,r) => SheetsAPI.call(url,'updateReservation',{reservation:r}),
  deleteReservation: (url,id) => SheetsAPI.call(url,'deleteReservation',{id}),
  saveRoom: (url,r) => SheetsAPI.call(url,'addRoom',{room:r}),
  updateRoom: (url,r) => SheetsAPI.call(url,'updateRoom',{room:r}),
  deleteRoom: (url,id) => SheetsAPI.call(url,'deleteRoom',{id}),
  saveUser: (url,u) => SheetsAPI.call(url,'addUser',{user:u}),
  updateUser: (url,u) => SheetsAPI.call(url,'updateUser',{user:u}),
  deleteUser: (url,id) => SheetsAPI.call(url,'deleteUser',{id}),
};

    : Math.min(+(f.discount||0), basePrice);

  useEffect(()=>{
    if(!manualTotal && selRoom && nights>0) s('total', calcTotal);
  }, [f.room, f.checkIn, f.checkOut, f.discount, discType, manualTotal]);

  useEffect(()=>{
    if(!f.room||!f.checkIn||!f.checkOut||f.checkIn>=f.checkOut){setConflict(null);return;}

      if(r.id===f.id) return false;
      if(r.room!==f.room) return false;
      if(r.status==='cancelled'||r.status==='checkedout') return false;
      return f.checkIn<r.checkOut && f.checkOut>r.checkIn;

/* ══════════ SCHEDULE ══════════ */
const Schedule = ({ res, onNew }) => {
  const [view,setView] = useState('month');
  const [cur,setCur] = useState(new Date());
  const t = toDay();

  const nav = d => {
    setCur(prev => {
      const n = new Date(prev.getTime());
      if(view==='month') n.setMonth(n.getMonth()+d);
      else if(view==='week') n.setDate(n.getDate()+7*d);
      else n.setDate(n.getDate()+d);
      return n;
    });
  };

  const goToday = () => setCur(new Date());

  const headerLabel = () => {
    if(view==='month') return `${MNS[cur.getMonth()]} ${cur.getFullYear()}`;
    if(view==='week'){
      const sw=new Date(cur); sw.setDate(cur.getDate()-cur.getDay());
      const ew=new Date(sw); ew.setDate(sw.getDate()+6);
      return `${sw.toLocaleDateString('en-GB',{day:'numeric',month:'short'})} – ${ew.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}`;
    }
    return cur.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  };

  const MonthView = () => {
    const y=cur.getFullYear(), m=cur.getMonth();
    const first=new Date(y,m,1), last=new Date(y,m+1,0);
    const cells=[];
    for(let i=0;i<first.getDay();i++){ const d=new Date(y,m,1-first.getDay()+i); cells.push({date:d,other:true}); }
    for(let d=1;d<=last.getDate();d++) cells.push({date:new Date(y,m,d),other:false});
    while(cells.length<42) { const d=new Date(y,m+1,cells.length-last.getDate()-first.getDay()+1); cells.push({date:d,other:true}); }
    const getEvts = dt => { const ds=dt.toISOString().split('T')[0]; return res.filter(r=>ds>=r.checkIn&&ds<r.checkOut&&r.status!=='cancelled'); };
    return (
      <div className="cal-wrap">
        <div className="cal-grid">
          {DSH.map(d=><div key={d} className="cal-dlbl">{d}</div>)}
          {cells.map((item,i)=>{
            const ds=item.date.toISOString().split('T')[0];
            const evts=getEvts(item.date);
            return (
              <div key={i} className={`cal-cell${ds===t?' tdy':''}${item.other?' om':''}`}>
                <div className="cal-dt">{item.date.getDate()}</div>
                {evts.slice(0,3).map(ev=>(
                  <div key={ev.id} className="cal-ev" style={{background:EVT_BG(ev.status),color:EVT_TX(ev.status)}}>
                    {ev.name.split(' ')[0]} · {ev.room}
                  </div>
                ))}
                {evts.length>3 && <div className="cal-ev" style={{background:'var(--bg2)',color:'var(--txt3)'}}>+{evts.length-3} more</div>}
              </div>
            );
          })}
        </div>
      </div>
    );
  };

  const WeekView = () => {
    const sw=new Date(cur); sw.setDate(cur.getDate()-cur.getDay());
    const wd=Array.from({length:7},(_,i)=>{ const d=new Date(sw); d.setDate(sw.getDate()+i); return d; });
    const hrs=Array.from({length:24},(_,i)=>i);
    const fh=h=>h===0?'12 AM':h<12?`${h} AM`:h===12?'12 PM':`${h-12} PM`;
    return (
      <div className="wk-wrap">
        <div className="wk-head">
          <div className="wk-hcell" style={{background:'var(--surf2)'}}/>
          {wd.map(d=>{ const ds=d.toISOString().split('T')[0]; return (
            <div key={ds} className={`wk-hcell${ds===t?' tdy':''}`}>
              {DSH[d.getDay()]}<br/><span style={{fontSize:14,fontWeight:700}}>{d.getDate()}</span>
            </div>
          ); })}
        </div>
        <div className="wk-body">
          {hrs.map(h=>(
            <div key={h} className="wk-row">
              <div className="wk-time">{fh(h)}</div>
              {wd.map(d=>{ const ds=d.toISOString().split('T')[0]; const evts=h===12?res.filter(r=>r.status!=='cancelled'&&ds>=r.checkIn&&ds<r.checkOut):[];
                return (
                  <div key={ds} className={`wk-cell${ds===t?' tdy':''}`}>
                    {evts.map(ev=>(
                      <div key={ev.id} style={{fontSize:9.5,background:EVT_BG(ev.status),color:EVT_TX(ev.status),borderRadius:3,padding:'2px 5px',marginBottom:2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontWeight:600}}>
                        {ev.name.split(' ')[0]} · {ev.room}
                      </div>
                    ))}
                  </div>
                );
              })}
            </div>
          ))}
        </div>
      </div>
    );
  };

  const DayView = () => {
    const ds=cur.toISOString().split('T')[0];
    const evts=res.filter(r=>r.status!=='cancelled'&&ds>=r.checkIn&&ds<r.checkOut);
    const fh=h=>h===0?'12 AM':h<12?`${h} AM`:h===12?'12 PM':`${h-12} PM`;
    return (
      <div className="dv-wrap">
        <div className="dv-head">
          <p style={{fontFamily:'var(--fd)',fontSize:16,fontWeight:600,color:ds===t?'var(--gold)':'var(--txt)'}}>{cur.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p>
          <p style={{fontSize:12.5,color:'var(--txt3)',marginTop:3}}>{evts.length} reservation{evts.length!==1?'s':''} active</p>
        </div>
        {evts.length>0 && (
          <div className="dv-events">
            {evts.map(ev=>(
              <div key={ev.id} className="dv-card" style={{background:EVT_BG(ev.status),borderLeftColor:EVT_BDR(ev.status)}}>
                <p style={{fontSize:13,fontWeight:600,color:EVT_TX(ev.status)}}>{ev.name}</p>
                <p style={{fontSize:11,color:EVT_TX(ev.status),opacity:.85,marginTop:2}}>{ev.room}</p>
                <span className={`bdg ${STATUS[ev.status]?.c}`} style={{fontSize:10,marginTop:6,display:'inline-flex'}}>{STATUS[ev.status]?.l}</span>
              </div>
            ))}
          </div>
        )}
        <div className="dv-slots">
          {Array.from({length:24},(_,h)=>(
            <div key={h} className="dv-row"><div className="dv-time">{fh(h)}</div><div className="dv-content"/></div>
          ))}
        </div>
      </div>
    );
  };

  return (
    <div>
      <div className="sch-nav">
        <div className="tabs" style={{marginBottom:0}}>
          {['month','week','day'].map(v=>(
            <button key={v} type="button" className={`tab${view===v?' on':''}`}
              onClick={()=>setView(v)}>
              {v.charAt(0).toUpperCase()+v.slice(1)}
            </button>
          ))}
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <button type="button" className="cal-nav-btn" onClick={()=>nav(-1)}><Ic n="chevL" sz={14}/></button>
          <span className="cal-nav-label">{headerLabel()}</span>
          <button type="button" className="cal-nav-btn" onClick={()=>nav(1)}><Ic n="chevR" sz={14}/></button>
          <button type="button" className="btn bg_ btn-sm" onClick={goToday}>Today</button>
          <button type="button" className="btn bp btn-sm" style={{marginLeft:2}} onClick={onNew}><Ic n="plus" sz={13}/>New</button>
        </div>
      </div>
      {view==='month' && <MonthView key={`m-${cur.getFullYear()}-${cur.getMonth()}`}/>}
      {view==='week' && <WeekView key={`w-${cur.toISOString()}`}/>}
      {view==='day' && <DayView key={`d-${cur.toISOString()}`}/>}
    </div>
  );
};

/* ══════════ RESERVATIONS LIST ══════════ */
const ResList = ({ res, setRes, rooms }) => {
  const [sf,setSF]=useState(false); const [ei,setEI]=useState(null);
  const [q,setQ]=useState(''); const [fs,setFS]=useState('all');
  const [vp,setVP]=useState(null);
  const { sheetsUrl, addSyncLog } = React.useContext(AppCtx);
  const t=toDay();

  const fil=res.filter(r=>{
    const ms=r.name.toLowerCase().includes(q.toLowerCase())||(r.room||'').toLowerCase().includes(q.toLowerCase())||r.id.toLowerCase().includes(q.toLowerCase());
    const ss=fs==='all'||r.status===fs;
    return ms&&ss;
  });

  const save = async (r) => {
    let updated;
    if(ei) updated=res.map(x=>x.id===r.id?r:x);
    else updated=[...res,r];
    setRes(updated);
    setSF(false); setEI(null);
    if(sheetsUrl) {
      try {
        const fn = ei ? SheetsAPI.updateReservation : SheetsAPI.saveReservation;
        const result = await fn(sheetsUrl, r);
        addSyncLog(result.success?'ok':'error', `${ei?'Updated':'Saved'} reservation ${r.id}`, result.error);
      } catch(e) { addSyncLog('error','Sync failed',e.message); }
    }
  };

  const doCI = async r => {
    const updated=res.map(x=>x.id===r.id?{...x,status:'checkedin'}:x);
    setRes(updated);
    if(sheetsUrl){const result=await SheetsAPI.updateReservation(sheetsUrl,{...r,status:'checkedin'});addSyncLog(result.success?'ok':'error',`Checked in ${r.name}`,result.error);}
  };
  const doCO = async r => {
    const updated=res.map(x=>x.id===r.id?{...x,status:'checkedout'}:x);
    setRes(updated);
    if(sheetsUrl){const result=await SheetsAPI.updateReservation(sheetsUrl,{...r,status:'checkedout'});addSyncLog(result.success?'ok':'error',`Checked out ${r.name}`,result.error);}
  };
  const del = async id => {
    if(!confirm('Delete this reservation?')) return;
    setRes(res.filter(r=>r.id!==id));
    if(sheetsUrl){const result=await SheetsAPI.deleteReservation(sheetsUrl,id);addSyncLog(result.success?'ok':'error',`Deleted reservation ${id}`,result.error);}
  };
  const nights=r=>nightsBetween(r.checkIn,r.checkOut);

  return (
    <div>
      <div className="sh_">
        <span className="st_">All Reservations</span>
        <button className="btn bp" onClick={()=>{setEI(null);setSF(true);}}><Ic n="plus" sz={14}/>New Reservation</button>
      </div>
      <div style={{display:'flex',gap:9,marginBottom:16,flexWrap:'wrap'}}>
        <div style={{position:'relative',flex:'1',minWidth:200}}>
          <Ic n="search" sz={14} style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'var(--txt3)'}}/>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search by name, room, ID…" style={{paddingLeft:32}}/>
        </div>
        <select value={fs} onChange={e=>setFS(e.target.value)} style={{width:'auto',minWidth:155}}>
          <option value="all">All Statuses</option>
          {Object.entries(STATUS).map(([k,v])=><option key={k} value={k}>{v.l}</option>)}
        </select>
      </div>
      <div className="tw">
        <table>
          <thead><tr><th>ID</th><th>Guest</th><th>Room</th><th>Check-in</th><th>Check-out</th><th>Nts</th><th>Guests</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody>
            {fil.length===0&&<tr><td colSpan={10} className="empty">No reservations found.</td></tr>}
            {fil.map(r=>{
              const isCI=r.checkIn===t&&r.status==='confirmed';
              const isCO=r.checkOut===t&&r.status==='checkedin';
              return (
                <tr key={r.id}>
                  <td><span style={{fontSize:11,color:'var(--txt3)',fontFamily:'monospace'}}>{r.id}</span></td>
                  <td><div style={{display:'flex',alignItems:'center',gap:8}}><div className="gr-ava" style={{width:28,height:28,fontSize:10}}>{ini(r.name)}</div><span style={{fontWeight:500}}>{r.name}</span></div></td>
                  <td style={{fontSize:13,color:'var(--txt2)'}}>{r.room||'—'}</td>
                  <td><div style={{fontSize:13}}>{fmt(r.checkIn)}</div><div style={{fontSize:10.5,color:'var(--txt3)'}}>{r.checkInTime}</div></td>
                  <td><div style={{fontSize:13}}>{fmt(r.checkOut)}</div><div style={{fontSize:10.5,color:'var(--txt3)'}}>{r.checkOutTime}</div></td>
                  <td style={{textAlign:'center'}}>{nights(r)}</td>
                  <td style={{textAlign:'center'}}>{r.guests}</td>
                  <td><div style={{fontWeight:500}}>{$$(r.total)}</div><div style={{fontSize:11,color:'var(--txt3)'}}>Dep: {$$(r.deposit)}</div></td>
                  <td><span className={`bdg ${STATUS[r.status]?.c}`}>{STATUS[r.status]?.l}</span></td>
                  <td style={{verticalAlign:'bottom'}}>
                    <div style={{display:'flex',flexDirection:'column',gap:6,alignItems:'flex-end'}}>
                      {isCI&&<button className="btn bs_ btn-sm" style={{width:'100%',justifyContent:'center'}} onClick={()=>doCI(r)}><Ic n="login" sz={12}/>Check In</button>}
                      {isCO&&<button className="btn bd btn-sm" style={{width:'100%',justifyContent:'center'}} onClick={()=>doCO(r)}><Ic n="logout" sz={12}/>Check Out</button>}
                      <div style={{display:'flex',gap:4}}>
                        {r.passport&&<button className="ib" title="View Passport" onClick={()=>setVP(r.passport)}><Ic n="eye"/></button>}
                        <button className="ib" title="Edit" onClick={()=>{setEI(r);setSF(true);}}><Ic n="edit"/></button>
                        <button className="ib" title="Delete" style={{color:'var(--er)'}} onClick={()=>del(r.id)}><Ic n="trash"/></button>
                      </div>
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      {sf && <ResForm allRes={res} rooms={rooms} onSave={save} onClose={()=>{setSF(false);setEI(null);}} initial={ei}/>}
      {vp && (
        <div className="ov" onClick={()=>setVP(null)}>
          <div style={{background:'var(--surf)',borderRadius:'var(--rlg)',padding:22,maxWidth:480,width:'100%',border:'1px solid var(--brd)'}} onClick={e=>e.stopPropagation()}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:12}}>
              <span style={{fontFamily:'var(--fd)',fontSize:17,fontWeight:600,display:'flex',alignItems:'center',gap:7}}><Ic n="pass"/>Passport / ID</span>
              <button className="ib" onClick={()=>setVP(null)}><Ic n="x"/></button>
            </div>
            <img src={vp} alt="Passport" style={{width:'100%',borderRadius:'var(--rsm)'}}/>
          </div>
        </div>
      )}
    </div>
  );
};

/* ══════════ CHECK IN ══════════ */
const CheckIn = ({ res, setRes }) => {
  const t=toDay();
  const { sheetsUrl, addSyncLog } = React.useContext(AppCtx);
  const arr=res.filter(r=>r.checkIn===t&&!['checkedin','checkedout','cancelled'].includes(r.status));
  const inH=res.filter(r=>r.status==='checkedin');
  const doCI=async r=>{
    setRes(res.map(x=>x.id===r.id?{...x,status:'checkedin'}:x));
    if(sheetsUrl){const result=await SheetsAPI.updateReservation(sheetsUrl,{...r,status:'checkedin'});addSyncLog(result.success?'ok':'error',`Checked in ${r.name}`);}
  };
  return (
    <div>
      <div className="sg" style={{gridTemplateColumns:'repeat(3,1fr)'}}>
        <div className="sc" style={{borderLeft:'4px solid #2563EB'}}>
          <div className="sl">Arriving Today</div>
          <div className="sv">{arr.length}</div>
          <div className="ss">Pending check-in</div>
        </div>
        <div className="sc" style={{borderLeft:'4px solid #16A34A'}}>
          <div className="sl">In House</div>
          <div className="sv">{inH.length}</div>
          <div className="ss">{inH.reduce((s,r)=>s+(+r.guests||0),0)} guests currently</div>
        </div>
        <div className="sc" style={{borderLeft:'4px solid var(--gold)'}}>

/* ══════════ REPORTS ══════════ */
const Reports = ({ res }) => {
  const now = new Date();
  const t=toDay();
  const done=res.filter(r=>r.status==='checkedout');
  const todayRev=done.filter(r=>r.checkOut===t).reduce((s,r)=>s+(+r.total||0),0);
  const monthRev=done.filter(r=>{const d=new Date(r.checkOut||'2000');return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();}).reduce((s,r)=>s+(+r.total||0),0);
  const yearRev=done.filter(r=>new Date(r.checkOut||'2000').getFullYear()===now.getFullYear()).reduce((s,r)=>s+(+r.total||0),0);

  const months=Array.from({length:12},(_,i)=>({
    month:MNS[i].slice(0,3),
    rev:done.filter(r=>{const d=new Date(r.checkOut||'2000');return d.getMonth()===i&&d.getFullYear()===now.getFullYear();}).reduce((s,r)=>s+(+r.total||0),0)
  }));
  const maxRev=Math.max(...months.map(m=>m.rev),1);

  const statusCount=Object.keys(STATUS).reduce((acc,k)=>({...acc,[k]:res.filter(r=>r.status===k).length}),{});

  return (
    <div>
      <div className="sg" style={{gridTemplateColumns:'repeat(3,1fr)'}}>
        <div className="sc" style={{borderLeft:'4px solid var(--gold)'}}>
          <div className="sl">Today's Revenue</div>
          <div className="sv" style={{fontSize:22}}>{$$(todayRev)}</div>
          <div className="ss">{done.filter(r=>r.checkOut===t).length} checkouts</div>
        </div>
        <div className="sc" style={{borderLeft:'4px solid #16A34A'}}>
          <div className="sl">Monthly Revenue</div>
          <div className="sv" style={{fontSize:22}}>{$$(monthRev)}</div>
          <div className="ss">{MNS[now.getMonth()]} {now.getFullYear()}</div>
        </div>
        <div className="sc" style={{borderLeft:'4px solid #2563EB'}}>
          <div className="sl">Yearly Revenue</div>
          <div className="sv" style={{fontSize:22}}>{$$(yearRev)}</div>
          <div className="ss">{now.getFullYear()} total</div>
        </div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'2fr 1fr',gap:16}}>
        <div className="card">
          <div className="card-title">Monthly Revenue — {now.getFullYear()}</div>
          <div style={{display:'flex',alignItems:'flex-end',gap:6,height:160,padding:'0 4px'}}>
            {months.map((m,i)=>(
              <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:4}}>
                <div title={$$(m.rev)} className="chart-bar" style={{width:'100%',height:`${Math.max(4,(m.rev/maxRev)*130)}px`,background:i===now.getMonth()?'var(--gold)':'var(--brd2)'}}/>
                <span style={{fontSize:9,color:'var(--txt3)',fontWeight:600}}>{m.month}</span>
              </div>
            ))}
          </div>
        </div>

        <div className="card">
          <div className="card-title">Booking Status</div>
          {Object.entries(STATUS).map(([k,v])=>(
            <div key={k} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid var(--brd)'}}>
              <span className={`bdg ${v.c}`}>{v.l}</span>
              <span style={{fontFamily:'var(--fd)',fontSize:18,fontWeight:700,color:'var(--txt)'}}>{statusCount[k]||0}</span>
            </div>
          ))}
          <div style={{marginTop:12,paddingTop:12,borderTop:'1px solid var(--brd)',display:'flex',justifyContent:'space-between'}}>
            <span style={{color:'var(--txt2)',fontSize:13}}>Total</span>
            <span style={{fontFamily:'var(--fd)',fontSize:18,fontWeight:700}}>{res.length}</span>
          </div>
        </div>
      </div>
    </div>
  );
};

          </div>
          <div style={{display:'flex',gap:9,alignItems:'center'}}>
            <button className="btn bp" onClick={test} disabled={testing||!url}>{testing?<><Ic n="refresh" sz={14} style={{animation:'spin 1s linear infinite'}}/>Testing…</>:<><Ic n="link" sz={14}/>Save &amp; Connect</>}</button>
            {sheetsUrl&&<button className="btn bg_" onClick={()=>{setSheetsUrl('');setUrl('');setTestResult(null);}}>Disconnect</button>}
            {testResult==='ok'&&<span className="al al-s" style={{margin:0,padding:'6px 12px'}}><Ic n="check"/>Connected!</span>}
            {testResult==='error'&&<span className="al al-e" style={{margin:0,padding:'6px 12px'}}><Ic n="warn"/>Connection failed</span>}
          </div>
        </div>

        <div className="card">
          <div className="card-title">Sync Log</div>
          {syncLog.length===0&&<p style={{fontSize:13,color:'var(--txt3)'}}>No sync activity yet.</p>}
          {syncLog.slice(0,20).map((l,i)=>(
            <div key={i} style={{display:'flex',alignItems:'flex-start',gap:10,padding:'8px 0',borderBottom:'1px solid var(--brd)',fontSize:13}}>
              <span style={{width:8,height:8,borderRadius:'50%',background:l.type==='ok'?'var(--ok)':l.type==='error'?'var(--er)':'var(--gold)',flexShrink:0,marginTop:4}}/>
              <div style={{flex:1}}>
                <span style={{color:l.type==='ok'?'var(--ok)':l.type==='error'?'var(--er)':'var(--wn)',fontWeight:500}}>{l.msg}</span>
                {l.detail&&<span style={{color:'var(--txt3)',fontSize:11,display:'block',marginTop:1}}>{l.detail}</span>}
              </div>
              <span style={{fontSize:11,color:'var(--txt3)',flexShrink:0}}>{l.time}</span>
            </div>
          ))}
        </div>
      </div>
    );
  };

  return (
    <div>
      <div className="tabs">
        {[['users','Users'],['rooms','Rooms & Units'],['db','Database']].map(([k,l])=>(
          <button key={k} type="button" className={`tab${tab===k?' on':''}`} onClick={()=>setTab(k)}>{l}</button>
        ))}
      </div>
      {tab==='users' && <UsersPanel/>}
      {tab==='rooms' && <RoomsPanel/>}
      {tab==='db' && <SheetsPanel/>}
    </div>
  );
};

/* ══════════ APP ══════════ */
const App = () => {
  const [res,setResRaw] = useLS('sm_res', seedRes);
  const [rooms,setRoomsRaw] = useLS('sm_rooms', seedRooms);
  const [users,setUsersRaw] = useLS('sm_users', seedUsers);
  const [sheetsUrl,setSheetsUrlRaw] = useLS('sm_sheetsUrl', ()=>'');
  const [theme,setThemeRaw] = useLS('sm_theme', ()=>'light');
  const [currentUser,setCurrentUser] = useState(null);
  const [page,setPage] = useState('dashboard');
  const [syncState,setSyncState] = useState('idle');
  const [syncLog,setSyncLog] = useState([]);
  const [newResOpen,setNewResOpen] = useState(false);

  // Apply theme
  useEffect(()=>{ document.documentElement.setAttribute('data-theme', theme); },[theme]);

  const setRes = v => setResRaw(v);
  const setRooms = v => setRoomsRaw(v);
  const setUsers = v => setUsersRaw(v);
  const setSheetsUrl = v => setSheetsUrlRaw(v);
  const toggleTheme = () => setThemeRaw(t=>t==='dark'?'light':'dark');

  const addSyncLog = (type, msg, detail='') => {
    const entry = { type, msg, detail, time: new Date().toLocaleTimeString() };
    setSyncLog(prev=>[entry,...prev].slice(0,50));
  };

  const dbConnected = !!sheetsUrl;

  const ctx = { sheetsUrl, setSheetsUrl, syncState, syncLog, addSyncLog, setCurrentUser };

  const NAV = [
    { id:'dashboard', label:'Dashboard', icon:'home' },
    { id:'schedule', label:'Schedule', icon:'calendar' },
    { id:'reservations', label:'Reservations', icon:'list',
      badge: res.filter(r=>r.checkIn===toDay()&&!['checkedin','checkedout','cancelled'].includes(r.status)).length||null },
    { id:'checkin', label:'Check In', icon:'login',
      badge: res.filter(r=>r.checkIn===toDay()&&!['checkedin','checkedout','cancelled'].includes(r.status)).length||null },
    { id:'checkout', label:'Check Out', icon:'logout',
      badge: res.filter(r=>r.checkOut===toDay()&&r.status==='checkedin').length||null },
    { id:'reports', label:'Reports', icon:'chart' },
    { id:'history', label:'Guest History', icon:'history' },
    { id:'settings', label:'Settings', icon:'cog' },
  ];

  const PAGE_TITLES = {
    dashboard:'Dashboard',schedule:'Schedule',reservations:'Reservations',
    checkin:'Check In',checkout:'Check Out',reports:'Reports',history:'Guest History',settings:'Settings'
  };

  if(!currentUser) return (
    <AppCtx.Provider value={ctx}>
      <Login users={users}/>
    </AppCtx.Provider>
  );

  return (
    <AppCtx.Provider value={ctx}>
      {/* ─ SIDEBAR ─ */}
      <aside className="sb">
        <div className="sb-logo">
          <div className="sb-logo-mark">
            <div className="sb-logo-icon"><Ic n="building" sz={18} style={{color:'#fff'}}/></div>
            <h1>StayManager</h1>
          </div>
          <span>Pro Edition</span>
        </div>
        <div className="sb-sec">Main</div>
        <nav className="sb-nav">
          {NAV.slice(0,5).map(n=>(
            <button key={n.id} className={`ni${page===n.id?' on':''}`} onClick={()=>setPage(n.id)}>
              <span className="ni-icon"><Ic n={n.icon} sz={17}/></span>
              {n.label}
              {!!n.badge && <span className="ni-bdg" style={{background:page===n.id?'rgba(201,168,76,.25)':'rgba(255,255,255,.12)',color:page===n.id?'var(--gold)':'rgba(255,255,255,.6)'}}>{n.badge}</span>}
            </button>
          ))}
          <div className="sb-sec" style={{padding:'18px 4px 5px'}}>Analytics &amp; Settings</div>
          {NAV.slice(5).map(n=>(
            <button key={n.id} className={`ni${page===n.id?' on':''}`} onClick={()=>setPage(n.id)}>
              <span className="ni-icon"><Ic n={n.icon} sz={17}/></span>
              {n.label}
            </button>
          ))}
        </nav>
        <div className="sb-footer">
          <div className="sb-user">
            <div className="sb-ava">{ini(currentUser.name)}</div>
            <div className="sb-uinfo">
              <p>{currentUser.name}</p>
              <span>{currentUser.role}</span>
            </div>
          </div>
          <button className="ni" onClick={()=>setCurrentUser(null)} style={{width:'100%'}}>
            <span className="ni-icon"><Ic n="logout" sz={17}/></span>Sign Out
          </button>
        </div>
      </aside>

      {/* ─ MAIN ─ */}
      <div className="main">
        <header className="topbar">
          <span className="tb-title">{PAGE_TITLES[page]}</span>
          <div className="tb-right">
            {/* DB status */}
            <div className="sync-pill" title={dbConnected?`Connected: ${sheetsUrl}`:'Not connected'}>
              <span className={`sync-dot ${dbConnected?'on':'off'}`}/>
              {dbConnected ? 'Database Connected' : 'Local Mode'}
            </div>
            {/* Theme toggle */}
            <button className="ib" onClick={toggleTheme} title="Toggle theme">
              <Ic n={theme==='dark'?'sun':'moon'} sz={16}/>
            </button>
          </div>
        </header>

        <main className="pg">
          {page==='dashboard' && <Dashboard res={res} rooms={rooms} onNewRes={()=>setNewResOpen(true)}/>}
          {page==='schedule' && <Schedule res={res} onNew={()=>setNewResOpen(true)}/>}
          {page==='reservations' && <ResList res={res} setRes={setRes} rooms={rooms}/>}
          {page==='checkin' && <CheckIn res={res} setRes={setRes}/>}
          {page==='checkout' && <CheckOut res={res} setRes={setRes}/>}
          {page==='reports' && <Reports res={res}/>}
          {page==='history' && <GuestHistory res={res}/>}
          {page==='settings' && <SettingsPage users={users} setUsers={setUsers} rooms={rooms} setRooms={setRooms}/>}
        </main>
      </div>

      {/* Global new reservation modal (from dashboard/schedule) */}
      {newResOpen && (
        <ResForm
          allRes={res}
          rooms={rooms}
          onSave={async r=>{
            const updated=[...res,r];
            setRes(updated);
            setNewResOpen(false);
            if(sheetsUrl){
              try{ const result=await SheetsAPI.saveReservation(sheetsUrl,r); addSyncLog(result.success?'ok':'error',`Saved reservation ${r.id}`,result.error); }
              catch(e){ addSyncLog('error','Sync failed',e.message); }
            }
          }}
          onClose={()=>setNewResOpen(false)}
          initial={null}
        />
      )}

      <style>{`
        @keyframes spin { to { transform: rotate(360deg); } }
      `}</style>
    </AppCtx.Provider>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
